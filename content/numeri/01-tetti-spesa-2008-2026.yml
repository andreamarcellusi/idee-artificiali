titolo: Tetti di spesa farmaceutica, 2008-2026
sintesi: Tetti per canale (convenzionata e acquisti diretti), base di calcolo AIFA, FSN nominale e scostamenti annui tra spesa e tetto.
idee: [tetti-previsioni, corsa-regionale-tetti]
versione: "1.0"
data: 2026-10-21
copertura: Italia, 2008-2026
unita: milioni di euro nominali; percentuali come quote
fonte_primaria: AIFA, metodologie di budget, monitoraggi e consuntivi annuali della spesa farmaceutica; FSN nominale da serie FIASO e leggi di bilancio. Il foglio Fonti elenca documento e link per ogni anno.
avvertenze:
  - Per alcuni anni la base o il tetto territoriale sono stimati da altri valori pubblicati; le note di riga dicono quali.
  - Dal 2017 cambiano i canali (L. 232/2016) e dal 2019 i gas medicinali sono scorporati dagli acquisti diretti. Le serie non sono confrontabili senza tenerne conto.
  - La colonna di verifica ricalcola il tetto dalle percentuali; differenze diverse da zero indicano arrotondamenti nei documenti AIFA.
files:
  - file: tetti_spesa_farmaceutica_2008_2026.xlsx
    descrizione: File completo con formule (fogli Dati, Scostamenti, Fonti).
  - file: tetti_dati.csv
    descrizione: Foglio Dati, valori calcolati.
  - file: tetti_scostamenti.csv
    descrizione: Foglio Scostamenti, valori calcolati.
  - file: tetti_fonti.csv
    descrizione: Registro delle fonti per anno.
