title: Idee poco intelligenti e molto artificiali
base_url: ""
site_url: https://ideeartificiali.it
goatcounter: ideeartificiali
author: Andrea Marcellusi
lede: >-
  Un economista sanitario, qualche modello linguistico e il mercato farmaceutico
  italiano. Le fonti sono vere, i numeri verificati, le conclusioni discutibili
  per costruzione. Questo è l'archivio, in attesa di diventare un libro.
prompts:
  - "analizza il mercato farmaceutico italiano. sii onesto, non gentile."
  - "spiega perché i tetti di spesa si sforano ogni anno. in 300 parole, senza colpevoli."
  - "confronta i tempi di accesso ai farmaci in Italia, Francia e Spagna. cita solo fonti vere."
  - "scrivi un libro sulla politica farmaceutica. io controllo i numeri."
ticker:
  - "I modelli producono numeri. Le decisioni, purtroppo, non si prendono da sole."
  - "Una risposta più veloce non è necessariamente una risposta più verificabile."
  - "Il risultato conta. Le assunzioni che lo producono, spesso, di più."
  - "Le definizioni si possono imparare. Il metodo richiede un po' più di lavoro."
  - "Nessuna di queste idee è stata sottoposta a revisione tra pari. Alcune a revisione tra modelli."
temi:
  spesa: Spesa e sostenibilità
  accesso: Accesso e HTA
  oncologia: Innovazione e oncologia
  ai: AI e metodi
  formazione: Formazione
