# Una riga per tema, mostrata sotto la rete.
temi_descrizioni:
  accesso: "Quanto ci mette un farmaco innovativo ad arrivare al paziente, chi lo valuta e con quali regole: AIFA, il JCA europeo, l'early access, il NICE, le Regioni."
  spesa: "Quanto spendiamo in farmaci, come si fissano i tetti, chi paga quando si sfora e come fanno gli altri paesi."
  ai: "Esperimenti con l'intelligenza artificiale sulle valutazioni di AIFA e sulla ricerca: cosa riesce a riprodurre e dove sbaglia."
  oncologia: "La spesa oncologica tra brevetti che scadono e terapie che arrivano: chi la assorbe e cosa compra."
  formazione: "Corsi e momenti di confronto, quando contengono un'idea."
